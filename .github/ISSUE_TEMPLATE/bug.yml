name: "Bug report"
description: "버그 신고"
labels: ["bug"]
body:
  - type: textarea
    id: issue
    attributes:
      label: "현상"
      description: "무엇이 어떻게 잘못되었는가"
      placeholder: "에러 메시지 요약 포함"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "재현 절차"
      description: "문제를 재현하는 단계"
      placeholder: "1) ...\n2) ...\n3) ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "예상 동작"
      placeholder: "정상적으로는 어떻게 동작해야 하는가"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: "환경"
      placeholder: "OS, 브라우저/버전, Node/Pnpm 버전 등"
  - type: textarea
    id: logs
    attributes:
      label: "로그/스크린샷"
      placeholder: "오류 로그, 네트워크 캡처, 스크린샷 또는 영상 링크"
