name: "Feature request"
description: "새 기능 제안"
labels: ["feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: "배경/문제"
      description: "이 기능이 왜 필요한가?"
      placeholder: "맥락, 문제, 사용자 페인포인트"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "요구사항(완료 기준)"
      description: "완료 조건을 체크리스트로 나열"
      placeholder: "- [ ] 사용자는 ~할 수 있다"
  - type: textarea
    id: fsd
    attributes:
      label: "FSD 영향"
      description: "어떤 레이어/경로가 변경되는가?"
      placeholder: "layers: app / entities / features / widgets / shared\npaths: features/company-crud/ui/CompanyForm"
  - type: textarea
    id: notes
    attributes:
      label: "비고"
      placeholder: "성능, 접근성, 리스크, 후속 작업 등"
